<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de mensajería del proyecto</title>
  <desc id="desc">El Producer recibe un pedido, lo publica en Kafka y el Tracker lo procesa. Los fallos se reintentan y, si persisten, llegan a la cola de errores.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#172554}.label{font:700 18px Arial,sans-serif;fill:#172554}.text{font:16px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}.box{stroke:#334155;stroke-width:2;rx:14}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Flujo de pedidos y manejo de errores</text>

  <rect x="35" y="230" width="150" height="100" class="box" fill="#dbeafe"/>
  <text x="110" y="268" text-anchor="middle" class="label">Cliente</text><text x="110" y="295" text-anchor="middle" class="text">Crea un pedido</text>

  <rect x="250" y="205" width="190" height="150" class="box" fill="#dcfce7"/>
  <text x="345" y="247" text-anchor="middle" class="label">Producer</text><text x="345" y="274" text-anchor="middle" class="text">Puerto 8081</text><text x="345" y="304" text-anchor="middle" class="small">POST /api/messages</text><text x="345" y="326" text-anchor="middle" class="small">Publica el evento</text>

  <rect x="510" y="205" width="190" height="150" class="box" fill="#fef3c7"/>
  <text x="605" y="247" text-anchor="middle" class="label">Kafka</text><text x="605" y="280" text-anchor="middle" class="text">Cola principal:</text><text x="605" y="310" text-anchor="middle" class="label">orders</text>

  <rect x="770" y="205" width="190" height="150" class="box" fill="#ede9fe"/>
  <text x="865" y="247" text-anchor="middle" class="label">Tracker</text><text x="865" y="274" text-anchor="middle" class="text">Puerto 8082</text><text x="865" y="304" text-anchor="middle" class="small">Grupo: group-1</text><text x="865" y="326" text-anchor="middle" class="small">Procesa el evento</text>

  <rect x="1015" y="230" width="150" height="100" class="box" fill="#dcfce7"/>
  <text x="1090" y="268" text-anchor="middle" class="label">Éxito</text><text x="1090" y="295" text-anchor="middle" class="text">Pedido procesado</text>

  <path d="M185 280 H250" class="arrow"/><text x="217" y="262" text-anchor="middle" class="small">HTTP</text>
  <path d="M440 280 H510" class="arrow"/><text x="475" y="262" text-anchor="middle" class="small">evento JSON</text>
  <path d="M700 280 H770" class="arrow"/><text x="735" y="262" text-anchor="middle" class="small">consume</text>
  <path d="M960 280 H1015" class="arrow"/>

  <path d="M865 355 V420 H585" class="arrow"/><text x="720" y="404" text-anchor="middle" class="small">si falla, reintenta</text>
  <rect x="315" y="445" width="270" height="105" class="box" fill="#ffedd5"/>
  <text x="450" y="480" text-anchor="middle" class="label">Colas de reintento</text><text x="450" y="508" text-anchor="middle" class="text">orders-retry-0 → -1 → -2</text><text x="450" y="532" text-anchor="middle" class="small">esperas: 1 s, 2 s y 4 s</text>

  <path d="M315 497 H200 V590" class="arrow"/><text x="257" y="478" text-anchor="middle" class="small">si vuelve a fallar</text>
  <rect x="45" y="540" width="210" height="85" class="box" fill="#fee2e2"/>
  <text x="150" y="575" text-anchor="middle" class="label">orders.dlt</text><text x="150" y="603" text-anchor="middle" class="text">Cola de errores</text>
</svg>
